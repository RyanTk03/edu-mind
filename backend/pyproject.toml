[project]
name = "edu-mind-backend"
version = "0.1.0"
description = "EDU-MIND Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Database
    "beanie>=1.27.0,<2.0.0",
    "motor>=3.6.0,<3.7.0",

    # Settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.0.0",

    # Utils
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
